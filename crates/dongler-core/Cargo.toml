[package]
name = "dongler-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Daniel Fat"]
description = "Created by Daniel Fat. Rust-native document extraction core for structured Markdown and LaTeX output."
readme = "../../README.md"
repository = "https://github.com/cristianexer/dongler"

[dependencies]
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
