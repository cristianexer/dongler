[package]
name = "dongler"
version = "0.3.2"
edition = "2021"
license = "MIT"
authors = ["Daniel Fat"]
description = "Command-line PDF and document extraction to Markdown, LaTeX, and JSON."
readme = "../../README.md"
repository = "https://github.com/cristianexer/dongler"
keywords = ["pdf", "markdown", "latex", "document", "extraction"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
dongler-core = { path = "../dongler-core", version = "0.3.2" }
clap = { version = "4.5", features = ["derive"] }
