[workspace]
members = [
    "crates/dongler-core",
    "crates/dongler-pipeline",
    "crates/dongler-cli",
    "crates/dongler-python",
    "crates/dongler-node",
    "crates/dongler-wasm",
]
resolver = "2"

[workspace.package]
version = "0.3.14"
edition = "2021"
license = "MIT"
authors = ["Daniel Fat"]
description = "Fast Rust-native PDF and document extraction with Markdown, LaTeX, and JSON output."
repository = "https://github.com/cristianexer/dongler"
