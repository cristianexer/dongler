[build-system]
requires = ["maturin>=1.8,<1.9"]
build-backend = "maturin"

[project]
name = "dongler"
version = "0.3.14"
description = "Fast Rust-native PDF and document extraction for Python, with Markdown, LaTeX, and JSON output."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Daniel Fat" }]
keywords = ["documents", "extraction", "pdf", "pdf-parser", "markdown", "latex", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://cristianexer.github.io/dongler/"
Repository = "https://github.com/cristianexer/dongler"
Documentation = "https://cristianexer.github.io/dongler/docs/intro"

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/dongler-python/Cargo.toml"
module-name = "dongler._dongler"
python-source = "python"
include = [
    "crates/dongler-core/**/*",
    "crates/dongler-python/**/*",
    "python/**/*",
    "README.md",
    "LICENSE",
    "NOTICE",
]

[dependency-groups]
dev = [
    "maturin>=1.8,<1.9",
    "pdfminer-six>=20251107",
    "pdfplumber>=0.11.8",
    "pymupdf>=1.26.5",
    "pypdf>=6.12.2",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
norecursedirs = ["eval/data", "eval/out"]
