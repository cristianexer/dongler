[package]
name = "dongler-python"
version = "0.3.13"
edition = "2021"
license = "MIT"
authors = ["Daniel Fat"]
description = "Python bindings for fast Rust-native PDF and document extraction."
repository = "https://github.com/cristianexer/dongler"
publish = false

[lib]
name = "_dongler"
crate-type = ["cdylib"]

[dependencies]
dongler-core = { path = "../dongler-core", version = "0.3.13" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
serde_json = "1.0"
