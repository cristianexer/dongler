[package]
name = "dongler-core"
version = "0.3.11"
edition = "2021"
license = "MIT"
authors = ["Daniel Fat"]
description = "Rust-native PDF and document extraction core for Markdown, LaTeX, and JSON output."
readme = "../../README.md"
repository = "https://github.com/cristianexer/dongler"
keywords = ["pdf", "markdown", "latex", "document", "extraction"]
categories = ["text-processing", "parser-implementations"]

[features]
default = ["parallel"]
# Parallel page/font decoding via rayon. Disable (e.g. for wasm32 targets that
# lack threads) to fall back to sequential extraction.
parallel = ["dep:rayon"]

[dependencies]
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
rayon = { version = "1.10", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
