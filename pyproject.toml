[build-system]
requires = ["maturin>=1.8,<1.9"]
build-backend = "maturin"

[project]
name = "dongler"
version = "0.2.0"
description = "Created by Daniel Fat. Python bindings for a Rust-native document extraction engine focused on Markdown and LaTeX output."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Daniel Fat" }]
keywords = ["documents", "extraction", "pdf", "markdown", "latex", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/cristianexer/dongler"
Repository = "https://github.com/cristianexer/dongler"

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/dongler-python/Cargo.toml"
module-name = "dongler._dongler"
python-source = "python"
include = [
    "crates/dongler-core/**/*",
    "crates/dongler-python/**/*",
    "python/**/*",
    "README.md",
    "LICENSE",
    "NOTICE",
]

[dependency-groups]
dev = [
    "maturin>=1.8,<1.9",
    "pytest>=8.0",
]
