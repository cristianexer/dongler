[package]
name = "dongler"
version = "0.3.15"
edition = "2021"
license = "MIT"
authors = ["Daniel Fat"]
description = "Command-line PDF and document extraction to Markdown, LaTeX, and JSON."
readme = "../../README.md"
repository = "https://github.com/cristianexer/dongler"
keywords = ["pdf", "markdown", "latex", "document", "extraction"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
dongler-core = { path = "../dongler-core", version = "0.3.15" }
dongler-pipeline = { path = "../dongler-pipeline", version = "0.3.15" }
clap = { version = "4.5", features = ["derive"] }

[features]
default = []
# Compile the ML stages (layout/OCR/table inference) into the CLI; `convert --ml`
# then runs the hybrid pipeline. Pulls ONNX Runtime + pdfium (see dongler-pipeline).
ml = ["dongler-pipeline/ml"]
